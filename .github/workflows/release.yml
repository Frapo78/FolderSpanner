name: Publish macOS Apple Silicon ZIP

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Identify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "I tag ufficiali devono avere il formato vX.Y.Z." >&2
              exit 1
            fi
            VERSION="${TAG#v}"
            PREVIEW=false
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAG="dev-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
            VERSION="0.2.0"
            PREVIEW=true
          else
            echo "Pubblicazione permessa solo da main o da tag vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"

      - name: Run automated Swift tests
        run: swift test

      - name: Build, inspect and ad-hoc sign the app
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Create ZIP and SHA-256 checksum
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP="FolderSpanner-macOS-arm64-${RELEASE_TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/FolderSpanner.app "dist/$ZIP"
          unzip -t "dist/$ZIP" > /dev/null
          (cd dist && shasum -a 256 "$ZIP" > SHA256SUMS.txt)
          echo "filename=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderSpanner-macOS-arm64-${{ steps.release.outputs.tag }}
          path: |
            ${{ steps.archive.outputs.zip }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PREVIEW: ${{ steps.release.outputs.preview }}
          ZIP_PATH: ${{ steps.archive.outputs.zip }}
        run: |
          set -euo pipefail
          if [[ "$IS_PREVIEW" == "true" ]]; then
            gh release create "$RELEASE_TAG" "$ZIP_PATH" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FolderSpanner Development Preview $RELEASE_TAG" \
              --prerelease \
              --latest=false \
              --notes "Automatically compiled on Apple Silicon after a successful build and test run. Commit: $GITHUB_SHA. This is a development preview: the app is ad-hoc signed, not Apple notarized. Back up your files and test with copies first."
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "FolderSpanner $RELEASE_TAG" \
              --generate-notes \
              --notes "Native Apple Silicon macOS app. Ad-hoc signed, not Apple notarized: macOS may require an explicit security override."
          fi
